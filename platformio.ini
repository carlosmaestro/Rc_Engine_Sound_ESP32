; PlatformIO Project Configuration File
;
; Uma build = um "build profile" (src/profiles/<Nome>.h) selecionado por um -D PROFILE_<NOME>.
; Ha um [env:*] por carro fisico:
;     pio run -e l120h_radio          Volvo L120H + radio IBUS + placa 30 pinos (default)
;     pio run -e carlos_bt_car        Carro Bluetooth (PS4/PS5) do usuario
;     pio run -e gol_quadrado         Carro Bluetooth com som de VW Gol quadrado
;     pio run -e carro_corrida        Carro Bluetooth com som de carro de corrida (V12)
;     pio run -e wemos_d1_mini        Variante Wemos D1 Mini
; O que cada profile configura (veiculo/sons, comm, radio, toggles, pinos, tuning):
; ver src/profiles/active.h e docs/10-profiles-de-build.md.

[platformio]
default_envs = l120h_radio

; ================================================================================================
; Base comum a todos os profiles
; ================================================================================================
[env]
platform = espressif32@6.10.0
framework = arduino
; Framework especial: arduino-esp32 2.0.17 + IDF 4.4 + Bluepad32 4.1.0 + BTstack (viabiliza PS4/PS5).
; TODO: fixar num commit em vez de main.zip (ver docs/09).
platform_packages = framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip

board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.partitions = huge_app.csv ; more flash for the app. No OTA!
monitor_speed   = 115200
upload_protocol = esptool
upload_speed = 921600 ; lower it to 115200, if you have upload issues
;upload_port     = COM4 ; your port may vary!
monitor_filters = esp32_exception_decoder ; shows more info on a backtrace

build_flags =
  ;-Os
  ;-DCORE_DEBUG_LEVEL=0 ; 0= none, 1= error, 2= warn, 3= info, 4= debug, 5= verbose

  ; build options for 80 x 160 pixel ST7735 SPI dashboard LCD (see "9_Dashboard.h")
  -DUSER_SETUP_LOADED=1 ; load TFT_eSPI parameters from below, rather than from "User_Setup_Select.h" in library directory
  -DST7735_DRIVER=1
  -DTFT_WIDTH=80
  -DTFT_HEIGHT=160
  -DST7735_REDTAB160x80=1
  -DTFT_RGB_ORDER=TFT_BGR ; change to "=TFT_RGB" or comment out if the display has wrong colours
  -DTFT_MISO=-1
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=-1
  -DTFT_DC=19
  -DTFT_RST=21
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=27000000
  -DUSE_HSPI_PORT=1

; Required libraries (downloaded automatically; requires https://git-scm.com/downloads) ----
lib_deps =
    SPI
    https://github.com/TheDIYGuy999/statusLED
    https://github.com/TheDIYGuy999/SBUS
    https://github.com/TheDIYGuy999/rcTrigger
    https://github.com/bmellink/IBusBM
    https://github.com/Bodmer/TFT_eSPI/archive/refs/tags/2.3.70.tar.gz ; 2.3.70 confirmed working
    https://github.com/FastLED/FastLED/archive/refs/tags/3.3.3.tar.gz  ; some users must use v3.3.3
    https://github.com/madhephaestus/ESP32AnalogRead
    https://github.com/lbernstone/Tone32

; ================================================================================================
; Build profiles (um por carro fisico) — ver src/profiles/
; ================================================================================================
[env:l120h_radio]
build_flags = ${env.build_flags} -D PROFILE_L120H_RADIO

[env:carlos_bt_car]
build_flags = ${env.build_flags} -D PROFILE_CARLOS_BT_CAR

[env:gol_quadrado]
build_flags = ${env.build_flags} -D PROFILE_GOL_QUADRADO

[env:carro_corrida]
build_flags = ${env.build_flags} -D PROFILE_CARRO_CORRIDA

[env:wemos_d1_mini]
build_flags = ${env.build_flags} -D PROFILE_WEMOS_D1_MINI
